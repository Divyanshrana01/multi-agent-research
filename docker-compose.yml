services:
  redis:
    # redis-stack, not plain redis — the search module is needed for
    # vector KNN in the semantic cache later
    image: redis/redis-stack:7.4.0-v1
    ports:
      - "6379:6379"
      - "8002:8001"   # redis insight
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
      POSTGRES_DB: research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
