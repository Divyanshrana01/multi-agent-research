<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Multi-agent research pipeline: search, summarise, write, verify." />
    <title>Research Agent</title>
    <!-- set before React mounts so the page never flashes the wrong theme -->
    <script>
      try {
        const saved = localStorage.getItem("research_agent_theme");
        const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = saved ?? (prefersLight ? "light" : "dark");
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
